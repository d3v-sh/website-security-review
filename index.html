      <div class="col eyebrow"><span class="ent-mask"><span class="ent-line">PLANET</span></span></div>
      <h1 class="col title"><span class="ent-mask"><span class="ent-line" id="planet-name">EARTH</span></span></h1>
      <div class="col rule"><span></span></div>
      <p class="col lede" id="planet-lede">Learn more about the fascinating details that we call our home,
         Planet Earth. Course enrollment <br>starts today. Early Bird tickets typically
         last a week, don&rsquo;t miss out!</p>
      <div class="col cta">
        <button class="planet planet-l" type="button" data-slot="l" id="slot-l" aria-label="Show VENUS">
          <img data-planet="earth" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png">
          <img data-planet="venus" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png">
          <img data-planet="mars" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png">
        </button>
        <button class="planet planet-r" type="button" data-slot="r" id="slot-r" aria-label="Show MARS">
          <img data-planet="earth" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png">
          <img data-planet="venus" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png">
          <img data-planet="mars" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png">
        </button>
        <a href="/courses.html" id="cta-btn">GET STARTED</a>
        <span class="label label-l" id="label-l"></span>
        <span class="label label-r" id="label-r"></span>
      </div>
    </div>
  </div>
  <button class="scroll" type="button" aria-label="Scroll to next section" id="scroll-btn">
    <svg viewBox="0 0 26 33" fill="none" aria-hidden="true">
      <path d="M13 1.5 V31.5 M1.9 20.4 L13 31.5 L24.1 20.4" stroke="#ffffff"
            stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
    </svg>
  </button>
</div>
<script>
(function(){
  'use strict';
  const ORDER=['earth','venus','mars'];
  const PLANETS={
    earth:{name:'EARTH',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png',lede:'Learn more about the fascinating details that we call our home, Planet Earth. Course enrollment <br>starts today. Early Bird tickets typically last a week, don\u2019t miss out!'},
    venus:{name:'VENUS',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png',lede:'The hottest world in our solar system, wrapped in clouds of sulfuric acid. Course enrollment <br>starts today. Early Bird tickets typically last a week, don\u2019t miss out!'},
    mars:{name:'MARS',still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png',lede:'The rust-red desert world, home to the tallest volcano we know of. Course enrollment <br>starts today. Early Bird tickets typically last a week, don\u2019t miss out!'}
  };
  const sky=document.querySelector('.sky');
  const videos=Object.fromEntries([...document.querySelectorAll('.sky video')].map(v=>[v.dataset.planet,v]));
  const slotL=document.getElementById('slot-l');
  const slotR=document.getElementById('slot-r');
  const nameEl=document.getElementById('planet-name');
  const ledeEl=document.getElementById('planet-lede');
  const labelL=document.getElementById('label-l');
  const labelR=document.getElementById('label-r');
  const scrollBtn=document.getElementById('scroll-btn');
  let featured=null;
  function warm(planet){const v=videos[planet];if(!v||v.src)return;const ds=v.dataset.src;if(!ds)return;v.preload='auto';v.src=ds;v.load();}
  function show(next){
    if(!PLANETS[next]||next===featured)return;
    featured=next;
    ORDER.forEach(p=>{const v=videos[p];if(!v)return;if(p===next){if(!v.src&&v.dataset.src){v.src=v.dataset.src;}v.classList.add('is-active');v.play().catch(()=>{});}else{v.classList.remove('is-active');v.pause();}});
    sky.style.backgroundImage='url('+PLANETS[next].still+')';
    nameEl.textContent=PLANETS[next].name;
    ledeEl.innerHTML=PLANETS[next].lede;
    const rest=ORDER.filter(p=>p!==next);
    [{btn:slotL,label:labelL,planet:rest[0]},{btn:slotR,label:labelR,planet:rest[1]}].forEach(({btn,label,planet})=>{
      btn.dataset.planet=planet;
      btn.setAttribute('aria-label','Show '+PLANETS[planet].name);
      label.textContent=PLANETS[planet].name;
      btn.querySelectorAll('img').forEach(img=>{img.classList.toggle('is-shown',img.dataset.planet===planet);});
    });
  }
  [slotL,slotR].forEach(btn=>{
    btn.addEventListener('click',function(){show(this.dataset.planet);});
    btn.addEventListener('pointerenter',function(){warm(this.dataset.planet);});
    btn.addEventListener('focus',function(){warm(this.dataset.planet);});
  });
  scrollBtn&&scrollBtn.addEventListener('click',function(){window.location.href='/courses.html';});
  function warmAll(){ORDER.forEach(warm);}
  if('requestIdleCallback'in window){requestIdleCallback(warmAll,{timeout:4000});}else{setTimeout(warmAll,2500);}
  show('earth');
  const navrow=document.querySelector('.navrow');
  const burgerBtn=document.getElementById('burger-btn');
  const nav=document.getElementById('site-nav');
  function setMenu(open){navrow.dataset.open=String(open);burgerBtn.setAttribute('aria-expanded',String(open));burgerBtn.setAttribute('aria-label',open?'Close navigation':'Open navigation');}
  setMenu(false);
  burgerBtn.addEventListener('click',function(e){e.stopPropagation();setMenu(navrow.dataset.open!=='true');});
  document.addEventListener('click',function(e){if(navrow.dataset.open!=='true')return;if(!nav.contains(e.target)&&!burgerBtn.contains(e.target)){setMenu(false);}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&navrow.dataset.open==='true'){setMenu(false);burgerBtn.focus();}});
  nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){setMenu(false);});});
  (function runEntrance(){const html=document.documentElement;if(!html.classList.contains('anim'))return;function addPlay(){requestAnimationFrame(function(){requestAnimationFrame(function(){html.classList.add('play');setTimeout(function(){html.classList.remove('anim','play');},2150);});});}
  const fontTimeout=new Promise(function(resolve){setTimeout(resolve,500);});
  Promise.race([document.fonts.ready,fontTimeout]).then(addPlay);})();
})();
</script>
</body>
</html>
